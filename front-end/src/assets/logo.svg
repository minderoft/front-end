<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <!-- Background -->
  <rect width="200" height="60" rx="8" fill="#1E3A5F"/>
  
  <!-- Building/Location Icon -->
  <g transform="translate(15, 10)">
    <!-- Building -->
    <rect x="5" y="15" width="30" height="25" fill="#FF6B35" rx="2"/>
    <!-- Roof -->
    <polygon points="0,15 20,0 40,15" fill="#FF6B35"/>
    <!-- Windows -->
    <rect x="10" y="20" width="8" height="8" fill="#1E3A5F" rx="1"/>
    <rect x="22" y="20" width="8" height="8" fill="#1E3A5F" rx="1"/>
    <rect x="10" y="32" width="8" height="6" fill="#1E3A5F" rx="1"/>
    <rect x="22" y="32" width="8" height="6" fill="#1E3A5F" rx="1"/>
    <!-- Door -->
    <rect x="17" y="32" width="6" height="8" fill="#1E3A5F" rx="1"/>
  </g>
  
  <!-- Plus Symbol -->
  <g transform="translate(55, 18)">
    <rect x="8" y="0" width="4" height="24" fill="#FF6B35" rx="2"/>
    <rect x="0" y="8" width="24" height="4" fill="#FF6B35" rx="2"/>
  </g>
  
  <!-- Text: LocaPlus -->
  <text x="95" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">LocaPlus</text>
</svg>